<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Anidle</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
    <style>html { zoom: 1.3; }</style>
</head>
<body>

<h1>Anidle</h1>
<p id="daily-streak-display" style="display:none; margin-top:-12px; margin-bottom:4px; font-size:13px; letter-spacing:0.03em;"></p>
<p id="daily-highscore-display" style="display:none; margin-top:-8px; margin-bottom:8px; font-size:12px; letter-spacing:0.03em; color:#ffcc00;">🏆 Best Streak: 0</p>

<div id="hints-area">
    <div class="hint-box locked" id="hint-1"></div>
    <div class="hint-box locked" id="hint-2"></div>
    <div class="hint-box locked" id="hint-3"></div>
</div>

<div id="anidle-input-area">
    <div id="autocomplete-wrapper">
        <input type="text" id="guess-input" placeholder="Type a character name..." autocomplete="off">
        <div id="autocomplete-list"></div>
    </div>
    <div id="guess-btn-wrap">
        <button id="guess-btn">Guess</button>
        <label class="colorblind-toggle" for="colorblind-toggle" title="Farbenblind-Modus">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <input type="checkbox" id="colorblind-toggle">
            <span class="cb-slider"></span>
        </label>
    </div>
</div>

<div id="attribute-headers" class="guess-row">
    <div class="guess-cell header-cell">Image</div>
    <div class="guess-cell header-cell">Name</div>
    <div class="guess-cell header-cell">Anime</div>
    <div class="guess-cell header-cell">Genre</div>
    <div class="guess-cell header-cell">Gender</div>
    <div class="guess-cell header-cell">Age</div>
    <div class="guess-cell header-cell">Height</div>
    <div class="guess-cell header-cell">Haircolor</div>
</div>

<div id="guess-list"></div>

<div id="win-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <img id="win-modal-img" src="" alt="">
        <p id="win-modal-message" style="color:#ff00ff; font-weight:bold; margin:12px 0 6px;"></p>
        <p id="win-modal-daily-note" style="display:none; color:#888; font-size:13px; margin-bottom:8px;">Come back tomorrow for the next Daily challenge!</p>
        <button id="win-modal-copy" style="display:none;" class="copy-share-btn" onclick="copyResult()" title="Copy result">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            Copy Result
        </button>
        <div class="win-modal-buttons">
            <a href="index.html"><button>Main Menu</button></a>
            <button id="win-modal-restart" style="display:none;">New Game</button>
        </div>
    </div>
</div>

<a href="index.html"><button class="back-btn">Back</button></a>
<a id="lexikon-shortcut-link" href="lexikon.html" class="lexikon-shortcut-link"><button class="lexikon-shortcut-btn" title="Lexikon">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
</button></a>
<script>
    (function() {
        const mode = new URLSearchParams(window.location.search).get('mode');
        const from = mode ? 'anidle.html?mode=' + mode : 'anidle.html';
        document.getElementById('lexikon-shortcut-link').href = 'lexikon.html?from=' + encodeURIComponent(from);
    })();
</script>
<script src="characters.js"></script>
<script src="achievements.js"></script>
<script src="anidle.js"></script>
</body>
</html>
