<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Top 10 – Ani Ranker</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        html { zoom: 1.25; }

        #top10-progress {
            color: #888;
            font-size: 14px;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        #top10-arena {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .top10-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .top10-img-wrap {
            width: 180px;
            height: 220px;
            border: 3px solid #ff00ff;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1e1e;
            box-shadow: 0 0 12px #ff00ff44;
            transition: box-shadow 0.15s, border-color 0.15s;
        }

        .top10-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .top10-card:hover .top10-img-wrap {
            box-shadow: 0 0 28px #ff00ffaa;
            border-color: #ff88ff;
        }

        .top10-card-name {
            color: #ff00ff;
            font-size: 14px;
            max-width: 180px;
            text-align: center;
            line-height: 1.3;
        }

        #top10-vs {
            color: #ff00ff;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff00ff;
            user-select: none;
        }

        /* Result */
        #top10-result {
            display: none;
            padding-bottom: 80px;
        }

        #top10-result h2 {
            color: #ff00ff;
            margin-bottom: 24px;
        }

        #top10-result-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .top10-pyramid-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            align-items: flex-end;
        }

        .top10-result-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .top10-result-num {
            color: #ff00ff;
            font-size: 13px;
            font-weight: bold;
        }

        .top10-result-img {
            width: 90px;
            height: 110px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #ff00ff;
            box-shadow: 0 0 8px #ff00ff44;
        }

        .top10-result-img.gold {
            width: 160px;
            height: 200px;
            border: 3px solid gold;
            box-shadow: 0 0 24px rgba(255, 215, 0, 0.7);
            border-radius: 10px;
        }

        .top10-result-img.silver {
            width: 110px;
            height: 136px;
            border: 2px solid silver;
            box-shadow: 0 0 14px rgba(192, 192, 192, 0.6);
        }

        .top10-result-img.bronze {
            width: 100px;
            height: 124px;
            border: 2px solid #cd7f32;
            box-shadow: 0 0 14px rgba(205, 127, 50, 0.6);
        }

        .top10-result-name {
            color: #ccc;
            font-size: 11px;
            max-width: 110px;
            text-align: center;
            line-height: 1.3;
        }

        #top10-restart-btn {
            position: fixed;
            bottom: 20px;
            left: calc(50% - 6px);
            transform: translateX(-100%);
        }

        #top10-copy-btn {
            position: fixed;
            bottom: 20px;
            left: calc(50% + 6px);
            width: 44px;
            height: 44px;
            padding: 0;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<h1>Top 10</h1>
<p id="top10-progress"></p>

<div id="top10-arena" style="display:none;">
    <div class="top10-card" id="top10-left" onclick="pick('left')">
        <span class="top10-card-name" id="top10-left-name"></span>
        <div class="top10-img-wrap">
            <img id="top10-left-img" src="" alt="">
        </div>
    </div>

    <div id="top10-vs">VS</div>

    <div class="top10-card" id="top10-right" onclick="pick('right')">
        <span class="top10-card-name" id="top10-right-name"></span>
        <div class="top10-img-wrap">
            <img id="top10-right-img" src="" alt="">
        </div>
    </div>
</div>

<div id="top10-result">
    <div id="top10-result-grid"></div>
</div>

<button id="top10-restart-btn" onclick="startGame()" style="display:none;">Play Again</button>
<button id="top10-copy-btn" onclick="copyResult()" style="display:none;" title="Copy Result">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
</button>
<button id="top10-start-btn" onclick="startGame()" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%);">Start</button>
<a href="index.html"><button class="back-btn">Back</button></a>
<a href="lexikon.html?from=top10.html" class="lexikon-shortcut-link"><button class="lexikon-shortcut-btn" title="Lexikon">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
</button></a>

<script src="characters.js"></script>
<script src="top10.js"></script>
</body>
</html>
