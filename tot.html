<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>This or That – Ani Ranker</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        html { zoom: 1.25; }

        #tot-progress {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        #tot-arena {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
        }

        .tot-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }

        .tot-img-wrap {
            width: 180px;
            height: 220px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-card);
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .tot-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .tot-card:hover .tot-img-wrap {
            box-shadow: 0 0 24px var(--accent-glow);
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .tot-card-name {
            color: var(--accent);
            font-size: 14px;
            max-width: 180px;
            text-align: center;
            line-height: 1.3;
        }

        #tot-vs {
            color: var(--accent);
            font-size: 28px;
            font-weight: bold;
            text-shadow: 0 0 12px var(--accent-glow);
            user-select: none;
        }

        /* Result screen */
        #tot-result {
            display: none;
        }

        #tot-result h2 {
            color: var(--accent);
            margin-bottom: 6px;
        }

        #tot-result p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 24px;
        }

        #tot-result-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin-bottom: 28px;
        }

        .tot-result-row {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .tot-result-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .tot-result-num {
            color: var(--accent);
            font-size: 13px;
            font-weight: bold;
        }

        .tot-champion-label {
            color: #fbbf24;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .tot-champion-img {
            width: 220px;
            height: 270px;
            object-fit: cover;
            border-radius: var(--radius);
            border: 2px solid #fbbf24;
            box-shadow: 0 0 32px rgba(251, 191, 36, 0.4);
        }

        .tot-result-img {
            width: 100px;
            height: 120px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }

        .tot-result-name {
            color: #ccc;
            font-size: 11px;
            max-width: 100px;
            text-align: center;
            line-height: 1.3;
        }

        #tot-restart-btn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

<h1>This or That</h1>
<p id="tot-progress"></p>

<div id="tot-arena" style="display:none;">
    <div class="tot-card" id="tot-left" onclick="pick('left')">
        <span class="tot-card-name" id="tot-left-name"></span>
        <div class="tot-img-wrap">
            <img id="tot-left-img" src="" alt="">
        </div>
    </div>

    <div id="tot-vs">VS</div>

    <div class="tot-card" id="tot-right" onclick="pick('right')">
        <span class="tot-card-name" id="tot-right-name"></span>
        <div class="tot-img-wrap">
            <img id="tot-right-img" src="" alt="">
        </div>
    </div>
</div>

<div id="tot-result">
    <div id="tot-champion"></div>
</div>

<button id="tot-restart-btn" onclick="startGame()" style="display:none;">Play Again</button>
<button id="tot-start-btn" onclick="startGame()" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%);">Start</button>
<a href="index.html"><button class="back-btn">Back</button></a>
<a href="lexikon.html?from=tot.html" class="lexikon-shortcut-link"><button class="lexikon-shortcut-btn" title="Lexikon">

</button></a>
<script src="characters.js"></script>
<script src="achievements.js"></script>
<script src="tot.js"></script>
</body>
</html>
