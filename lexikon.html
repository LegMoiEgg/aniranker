<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <script src="pwa.js" defer></script>
    <title>Lexikon – Ani Ranker</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
    <style>html { zoom: 1.25; }</style>
</head>
<body>

<h1>Character Lexikon</h1>
<p id="lexikon-count" style="color:var(--text-muted); text-align:center; margin-top:-10px; margin-bottom:10px;"></p>

<div id="lexikon-sort-bar">
    <label for="lexikon-sort">Sortieren nach:</label>
    <select id="lexikon-sort">
        <option value="alphabet">Alphabet</option>
        <option value="anime">Anime</option>
        <option value="height">Größe</option>
        <option value="age">Alter</option>
        <option value="haircolor">Haarfarbe</option>
    </select>
    <button class="sort-dir-btn" id="sort-dir" title="Sortierreihenfolge umkehren">&#9650;</button>
</div>

<div id="lexikon-search-bar">
    <input type="text" id="lexikon-search" placeholder="Charakter oder Anime suchen..." autocomplete="off">
</div>

<div id="lexikon-grid"></div>

<div id="lexikon-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <button class="modal-close" onclick="closeModal()">&#10005;</button>
        <img id="modal-img" src="" alt="">
        <h2 id="modal-name"></h2>
        <table id="modal-table"></table>
    </div>
</div>

<a id="back-link" href="index.html"><button class="back-btn" aria-label="Zurück" title="Zurück"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button></a>
<script>
    const fromPage = new URLSearchParams(window.location.search).get('from');
    if (fromPage) document.getElementById('back-link').href = decodeURIComponent(fromPage);
</script>

<script src="characters.js"></script>
<script src="achievements.js"></script>
<script src="lexikon.js"></script>
</body>
</html>
