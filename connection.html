<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Connection – Ani Ranker</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Connection</h1>

<!-- Gelöste Gruppen erscheinen hier -->
<div id="conn-solved"></div>

<!-- 4x4 Grid -->
<div id="conn-grid"></div>

<!-- Controls unterhalb des Grids -->
<div id="conn-controls">
    <div id="conn-lives"></div>
    <button id="conn-submit" disabled>Submit</button>
</div>

<!-- Ergebnis-Overlay bei Game Over / Win -->
<div id="conn-result-overlay" style="display:none;">
    <div id="conn-result-box">
        <h2 id="conn-result-title"></h2>
        <div id="conn-result-groups"></div>
        <button id="conn-restart-btn" onclick="startConnection()">New Game</button>
        <button id="conn-home-btn" onclick="window.location.href='index.html'">Hauptmenü</button>
    </div>
</div>

<a href="index.html"><button class="back-btn">Back</button></a>

</body>
